candidate_identity_rules:
  floating_refs_forbidden: true
  forbidden_aliases: [master, main, latest, nightly]
  later_candidate_substitution_forbidden: true
  newly_appearing_pnt_revision_substitution_forbidden: true

no_repair_detection:
  D0:
    name: candidate-environment-identity
    class_on_failure: apparatus_or_provenance
  D1:
    name: package-graph-manifest-resolution
    class_on_failure: package_resolution
  D2:
    name: project-mathlib-only-sentinels
    attempt_all_independently: true
    targets:
      - Formalization.Erdos678.Intervals
      - Formalization.Erdos678.ValuationBasic
      - Formalization.Erdos678.Claim4Density
  D3:
    name: external-pnt-support-boundary
    target: PrimeNumberTheoremAnd
  D4:
    name: project-pnt-boundary-sentinel
    prerequisite: D3-green
    target: Formalization.Erdos678.Claim4RelativePrimePNT
  D5:
    name: canonical-erdos-678-endpoint
    prerequisite: D3-green
    target: Formalization.Erdos678.Erdos678Final
  D6:
    name: canonical-import-and-full-graph
    prerequisite: required-prior-stages-green
    commands:
      - lake exe mk_all --check
      - lake build Formalization

failure_owner_classes:
  - apparatus_or_provenance
  - package_resolution
  - lean_toolchain
  - mathlib_or_transitive_dependency
  - pnt_dependency_support
  - project_owned
  - ambiguous

repair_policy:
  no_repair_before_detection_pass_complete: true
  dependency_source_edits_allowed: false
  alternate_pnt_revision_allowed: false
  project_owned_scope:
    - formalization/Formalization/Erdos678/**/*.lean
    - formalization/Formalization.lean:import-only
  forbidden_repair_targets:
    - .lake/packages/**
    - formalization/lakefile.toml:beyond-candidate-setup
    - formalization/lean-toolchain:beyond-candidate-setup
    - formalization/lake-manifest.json:beyond-candidate-setup
    - problems/678/S2_UPGRADE_ROBUSTNESS_PROTOCOL.md
    - problems/678/S2_UPGRADE_ROBUSTNESS_MATRIX.yaml
  immutable_regression_files:
    - formalization/Formalization/Erdos678/ConcreteTests.lean
    - formalization/Formalization/Erdos678/Erdos678FinalTests.lean
    - formalization/Formalization/Erdos678/ExternalStatementBridgeTests.lean
  frozen_semantic_endpoint_headers:
    - cambie_lcm_ratio_eventually_with_large_start_real
    - erdos678_unbounded_witnesses
    - erdos678_good_lengths_infinite
    - erdos678_formalConjectures_eventual_nonempty
  max_repair_batches: 12
  max_project_owned_files_touched: 10
  max_aggregate_line_churn_additions_plus_deletions: 250
  full_file_rewrite_to_evade_budget: forbidden

repair_tracks:
  mathlib_only:
    eligibility: D2-project-owned-failure-with-D0-D1-valid
    goal: all-D2-sentinels-green
    remains_interpretable_if_D3_dependency_blocked: true
  pnt_dependent_full:
    eligibility: D3-green
    ordered_targets: [D4, D5, D6]
    stop_if_dependency_support_fails: true

required_outcomes_per_candidate:
  provenance:
    - exact_baseline_commit
    - exact_candidate_lean
    - exact_mathlib_identity
    - exact_pnt_identity
    - runner_image
    - runner_version
    - exact_apparatus_commit
  detection:
    - D0_D6_status_where_applicable
    - all_D2_sentinel_results
    - first_failing_file_or_declaration_per_stage
    - primary_failure_owner
    - deepest_green_stage
    - full_no_repair_survivor
  repair:
    - repair_eligibility
    - final_repair_class
    - repair_batch_count
    - project_owned_files_touched
    - diff_hunks
    - additions
    - deletions
    - third_party_source_files_touched_must_equal_zero
    - immutable_regression_files_touched_must_equal_zero
    - semantic_header_fingerprint_changes_must_equal_zero
    - final_targets_reached

final_repair_classes:
  - not_needed
  - repaired_green
  - dependency_support_blocked
  - project_repair_budget_exceeded
  - apparatus_invalid

scientific_limits:
  - no_general_maintainability_claim
  - no_human_repair_time_claim
  - no_architecture_superiority_claim
  - no_expected_future_upgrade_cost_claim
  - no_general_lean_mathlib_compatibility_claim
  - dependency_support_blocker_is_not_proof_quality_defect
  - timing_is_not_an_outcome_metric

