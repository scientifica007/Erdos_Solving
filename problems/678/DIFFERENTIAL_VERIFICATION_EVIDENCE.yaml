verified_findings:
  - internal erdosM interval semantics are machine-bridged to public Finset.Ioc semantics
  - internal proof derives the Formal-Conjectures-style eventual-nonempty statement
  - internal strong theorem is machine-lifted to every real C >= 1
  - current public comparator source compiles unchanged under the internal pinned Lean/Mathlib/PNT+ environment
  - internal and public audited endpoints depend on the same selected standard logical axioms
  - persistent S1 PR has literal exact-head verification and the merged main commit has literal post-merge verification
  - transient CI infrastructure failure was isolated without changing mathematical artifacts

non_findings_and_limits:
  - S1 does not establish that one architecture is superior
  - S1 does not establish genealogical independence of all proof ideas
  - S1 is not a literal simultaneous import because both sources use namespace Erdos678
  - existing timing observations are not a controlled performance comparison
  - maintenance, dependency-coupling, repair-locality, mutation-resistance, and upgrade-robustness claims require S2

