    design:
      paired_fresh_runner_replicates: 6
      order_sequence:
        - internal-first
        - comparator-first
        - internal-first
        - comparator-first
        - internal-first
        - comparator-first
      setup_timing: excluded-and-recorded-separately
      cold_definition: artifact-owned-build-outputs-removed-dependencies-prepared
      warm_definition: immediate-unchanged-identical-target-repeat
      retain_all_observations: true
      silent_outlier_exclusion: forbidden
      infrastructure_retry: allowed-only-with-explicit-classification
      build_failure_retry: forbidden-without-diagnosis
    metrics:
      - wall_seconds
      - user_seconds
      - sys_seconds
      - max_rss_kib
      - exit_code
      - lake_built_progress_lines
    aggregation:
      - median
      - minimum
      - maximum
      - MAD
      - IQR
      - paired-descriptive-difference
      - paired-descriptive-ratio
    interpretation_limits:
      - warm is no-change incremental behavior not compilation speed
      - descriptive hosted-runner evidence only
      - no general architecture-superiority claim
      - no maintainability or repair-locality inference
      - no extrapolation to other toolchain/cache/machine regimes

