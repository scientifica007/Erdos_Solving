name: Erdos 678 S2e Upgrade Detection Parallel

on:
  pull_request:
    paths:
      - .github/workflows/erdos678-s2e-upgrade-detection-parallel.yml

permissions:
  contents: read
  actions: read

jobs:
  detection:
    name: detection-${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        candidate: [U1, U2]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record workflow and apparatus identities
        run: |
          set -euo pipefail
          printf 'workflow_commit=%s\n' "$(git rev-parse HEAD)"
          printf 'runtime_v2_apparatus_commit=%s\n' "$(git log -1 --format=%H -- problems/678/experiments/s2_upgrade_robustness_runtimefix_v2.py)"
          printf 'frozen_core_commit=%s\n' "$(git log -1 --format=%H -- problems/678/experiments/s2_upgrade_robustness.py)"
          printf 'candidate=%s\n' '${{ matrix.candidate }}'

      - name: Install Elan only
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          use-mathlib-cache: false
          use-github-cache: false
          check-reservoir-eligibility: false
          leanchecker: false
          lean4checker: false
          nanoda: false

      - name: Execute frozen no-repair detection for ${{ matrix.candidate }}
        id: detection
        run: |
          set -euo pipefail
          python3 problems/678/experiments/s2_upgrade_robustness_runtimefix_v2.py \
            --phase detection \
            --candidate '${{ matrix.candidate }}' \
            --repo . \
            --output "${RUNNER_TEMP}/s2e-${{ matrix.candidate }}"

      - name: Upload exact candidate artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos678-s2e-${{ matrix.candidate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/s2e-${{ matrix.candidate }}
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-complete-frozen-set
    if: always()
    needs: detection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact U1/U2 artifacts from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          OUT_ROOT: ${{ runner.temp }}/s2e-inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, json, os, pathlib, time, urllib.request, zipfile

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          run_id = os.environ['RUN_ID']
          root = pathlib.Path(os.environ['OUT_ROOT'])
          root.mkdir(parents=True, exist_ok=True)
          expected = {
              'U1': f'erdos678-s2e-U1-{run_id}',
              'U2': f'erdos678-s2e-U2-{run_id}',
          }
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'erdos678-s2e-complete-set-aggregator',
          }

          def request(url):
              return urllib.request.Request(url, headers=headers)

          artifacts = None
          list_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'
          for _ in range(30):
              with urllib.request.urlopen(request(list_url), timeout=30) as response:
                  payload = json.load(response)
              by_name = {a['name']: a for a in payload.get('artifacts', []) if not a.get('expired')}
              if all(name in by_name for name in expected.values()):
                  artifacts = by_name
                  break
              time.sleep(10)
          if artifacts is None:
              raise SystemExit(f'missing exact U1/U2 artifacts for workflow run {run_id}')

          for short, name in expected.items():
              artifact = artifacts[name]
              with urllib.request.urlopen(request(artifact['archive_download_url']), timeout=120) as response:
                  data = response.read()
              target = root / short
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  zf.extractall(target)
              print(f'{short}_artifact_id={artifact["id"]}')
              print(f'{short}_artifact_name={name}')
              print(f'{short}_artifact_size={artifact["size_in_bytes"]}')
          PY

      - name: Combine complete frozen candidate set fail-closed
        id: combine
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 problems/678/experiments/s2_upgrade_robustness_combine.py \
            --u1 "${RUNNER_TEMP}/s2e-inputs/U1" \
            --u2 "${RUNNER_TEMP}/s2e-inputs/U2" \
            --output "${RUNNER_TEMP}/s2e-complete"

      - name: Upload complete frozen-set artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos678-s2e-detection-complete-${{ github.run_id }}
          path: ${{ runner.temp }}/s2e-complete
          if-no-files-found: error
          retention-days: 90

      - name: Enforce complete-set validity
        if: steps.combine.outcome != 'success'
        run: |
          echo 'Complete frozen-set combiner rejected the candidate artifacts.' >&2
          exit 1
