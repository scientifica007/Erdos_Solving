name: Temporary S2e Timeoutfix Postmerge Audit

on:
  pull_request:
    paths:
      - .github/workflows/erdos678-s2e-timeoutfix-postmerge-audit.yml

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Locate exact main Lean Verification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 279ad23209e19ccef2e6d890c219ac8c688c8bd7
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          expected = os.environ['EXPECTED_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'erdos678-s2e-postmerge-audit',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          runs_url = f'https://api.github.com/repos/{repo}/actions/workflows/lean.yml/runs?branch=main&event=push&per_page=30'
          for attempt in range(90):
              runs = get(runs_url)['workflow_runs']
              matches = [r for r in runs if r.get('head_sha') == expected]
              if matches:
                  run = matches[0]
                  print(f"candidate_run={run['id']} status={run['status']} conclusion={run.get('conclusion')}")
                  if run['status'] == 'completed':
                      if run.get('conclusion') != 'success':
                          raise SystemExit(f"exact main run failed: {run['id']} / {run.get('conclusion')}")
                      jobs = get(run['jobs_url'])['jobs']
                      lean = [j for j in jobs if j.get('name') == 'lean']
                      if len(lean) != 1:
                          raise SystemExit(f"expected one lean job, got {len(lean)}")
                      job = lean[0]
                      if job.get('status') != 'completed' or job.get('conclusion') != 'success':
                          raise SystemExit(f"lean job not successful: {job['id']} {job.get('status')} {job.get('conclusion')}")
                      print(f"MAIN_RUN_ID={run['id']}")
                      print(f"MAIN_JOB_ID={job['id']}")
                      print(f"MAIN_HEAD_SHA={run['head_sha']}")
                      print('POSTMERGE_AUDIT=PASS')
                      sys.exit(0)
              time.sleep(10)
          raise SystemExit('timed out locating completed exact-main Lean Verification')
          PY
