name: Lean Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record verified commit
        run: |
          set -euo pipefail
          printf 'verified_commit=%s\n' "$(git rev-parse HEAD)"

      - name: Verify Erdős #678 reproducibility package
        run: python3 ../problems/678/reproducible/scripts/verify_package.py

      - name: Build canonical Lean graph
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: formalization
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          test: false
          mk_all-check: true

      - name: Publish exact-main verification status
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          VERIFY_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/erdos678-status.json
          import json
          import os

          print(json.dumps({
              "state": os.environ["VERIFY_STATE"],
              "target_url": os.environ["VERIFY_TARGET_URL"],
              "description": "Erdos #678 package + canonical Lean verification",
              "context": "erdos678/post-merge-verification",
          }))
          PY
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/erdos678-status.json
