name: Lean Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record verified commit
        run: |
          set -euo pipefail
          printf 'verified_commit=%s\n' "$(git rev-parse HEAD)"

      - name: Build canonical Lean graph
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          test: false
          mk_all-check: true
