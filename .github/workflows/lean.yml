name: Lean Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record verified commit
        id: verified
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          printf 'verified_commit=%s\n' "$SHA"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Build canonical Lean graph
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          test: false
          mk_all-check: true

      - name: Publish exact-head verification status
        if: ${{ always() && steps.verified.outputs.sha != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.verified.outputs.sha }}',
              state: ok ? 'success' : 'failure',
              context: 'erdos678/canonical-exact-head',
              description: ok ? 'Canonical Lean exact-head verified' : 'Canonical Lean exact-head failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
