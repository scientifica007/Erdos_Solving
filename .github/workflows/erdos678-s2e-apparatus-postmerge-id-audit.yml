name: Erdos 678 S2e Apparatus Postmerge ID Audit

on:
  pull_request:
    paths:
      - .github/workflows/erdos678-s2e-apparatus-postmerge-id-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Locate exact successful main push verification
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 570f0eb6f27ce384bebbd6bce2d631c1c046fedd
          EXPECTED_WORKFLOW: Lean Verification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          expected = os.environ["EXPECTED_WORKFLOW"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "erdos678-s2e-apparatus-postmerge-id-audit",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          main_sha = get_json(f"{api}/repos/{repo}/branches/main")["commit"]["sha"]
          print(f"main_head_at_audit={main_sha}")
          if main_sha != target:
              raise SystemExit(f"main moved: {main_sha} != {target}")

          chosen = None
          for attempt in range(40):
              data = get_json(
                  f"{api}/repos/{repo}/actions/runs?head_sha={target}&event=push&per_page=100"
              )
              candidates = [
                  run for run in data.get("workflow_runs", [])
                  if run.get("name") == expected
                  and run.get("head_sha") == target
                  and run.get("event") == "push"
              ]
              if candidates:
                  candidates.sort(key=lambda run: run.get("created_at", ""), reverse=True)
                  chosen = candidates[0]
                  print(
                      f"probe_run_id={chosen['id']} status={chosen['status']} "
                      f"conclusion={chosen.get('conclusion')}"
                  )
                  if chosen.get("status") == "completed":
                      break
              else:
                  print(f"probe_run=none attempt={attempt + 1}")
              time.sleep(15)
          else:
              raise SystemExit("timed out waiting for exact main push Lean Verification")

          if chosen is None or chosen.get("conclusion") != "success":
              raise SystemExit(f"exact main push Lean Verification not successful: {chosen}")

          jobs = get_json(chosen["jobs_url"])
          lean_jobs = [job for job in jobs.get("jobs", []) if job.get("name") == "lean"]
          if len(lean_jobs) != 1:
              raise SystemExit(f"expected one lean job, found {len(lean_jobs)}")
          job = lean_jobs[0]
          if job.get("status") != "completed" or job.get("conclusion") != "success":
              raise SystemExit(
                  f"lean job {job['id']} status={job.get('status')} "
                  f"conclusion={job.get('conclusion')}"
              )

          print(f"postmerge_run_id={chosen['id']}")
          print(f"postmerge_job_id={job['id']}")
          print(f"postmerge_head_sha={chosen['head_sha']}")
          print("s2e_apparatus_postmerge_id_audit=PASS")
          PY
