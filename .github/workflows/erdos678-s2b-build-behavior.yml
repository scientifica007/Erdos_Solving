name: Erdos 678 S2b Build Behavior

on:
  push:
    branches:
      - "agent/erdos678-s2b-build-behavior-*"
    paths:
      - "problems/678/S2_BUILD_BEHAVIOR_PROTOCOL.md"
      - "problems/678/experiments/s2_build_behavior.py"
      - ".github/workflows/erdos678-s2b-build-behavior.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erdos678-s2b-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - replicate: 1
            order: internal-first
          - replicate: 2
            order: comparator-first
          - replicate: 3
            order: internal-first
          - replicate: 4
            order: comparator-first
          - replicate: 5
            order: internal-first
          - replicate: 6
            order: comparator-first
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record experiment identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 's2b_experiment_commit=%s\n' "$actual"
          printf 's2b_replicate=%s\n' '${{ matrix.replicate }}'
          printf 's2b_order=%s\n' '${{ matrix.order }}'
          test "$actual" = "$GITHUB_SHA"
      - name: Prepare pinned Lean and Mathlib environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization
          auto-config: false
          build: false
          test: false
          lint: false
          mk_all-check: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Run paired S2b measurement
        run: |
          set -euo pipefail
          python3 problems/678/experiments/s2_build_behavior.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --replicate '${{ matrix.replicate }}' \
            --order '${{ matrix.order }}' \
            --output-dir "problems/678/experiments/out/s2b-r${{ matrix.replicate }}"
      - name: Print replicate summary
        if: always()
        run: |
          path="problems/678/experiments/out/s2b-r${{ matrix.replicate }}/summary.md"
          if [ -f "$path" ]; then cat "$path"; else echo "No summary produced; inspect measurement logs."; fi
      - name: Upload exact replicate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos678-s2b-${{ github.sha }}-r${{ matrix.replicate }}-${{ matrix.order }}
          path: problems/678/experiments/out/s2b-r${{ matrix.replicate }}
          if-no-files-found: warn
          retention-days: 30
