name: Erdos 678 S2e Timeoutfix Static Audit

on:
  pull_request:
    paths:
      - .github/workflows/erdos678-s2e-timeoutfix-static-audit.yml
      - problems/678/experiments/s2_upgrade_robustness_timeoutfix.py

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compile wrapper
        run: python3 -m py_compile problems/678/experiments/s2_upgrade_robustness_timeoutfix.py

      - name: Execute non-observational static check
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/s2e-timeoutfix-static"
          python3 problems/678/experiments/s2_upgrade_robustness_timeoutfix.py \
            --phase static-check \
            --repo . \
            --output "$out" | tee "$out.stdout"
          grep -q '"status": "PASS"' "$out.stdout"
          test -f "$out/STATIC_CHECK.json"
          test ! -e "$out/result.json"
          test ! -d "$out/candidates"
          grep -q '"candidate_ids"' "$out/STATIC_CHECK.json"
          printf 'static_audit=PASS\n'
