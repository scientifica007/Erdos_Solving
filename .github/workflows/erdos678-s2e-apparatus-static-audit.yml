name: Erdos 678 S2e Apparatus Static Audit

on:
  push:
    branches:
      - agent/erdos678-s2e-upgrade-apparatus-20260818
  pull_request:
    paths:
      - problems/678/experiments/s2_upgrade_robustness.py
      - .github/workflows/erdos678-s2e-apparatus-static-audit.yml

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compile Python apparatus
        run: python3 -m py_compile problems/678/experiments/s2_upgrade_robustness.py
      - name: Run non-observational static contract check
        run: |
          python3 problems/678/experiments/s2_upgrade_robustness.py \
            --phase static-check \
            --repo . \
            --output /tmp/s2e-static-audit
      - name: Confirm no candidate execution artifact
        run: |
          test -f /tmp/s2e-static-audit/STATIC_CHECK.json
          test ! -e /tmp/s2e-static-audit/result.json
          test ! -d /tmp/s2e-static-audit/candidates
