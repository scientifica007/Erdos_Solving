name: Erdos 678 S2d Postmerge Audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/erdos678-s2d-postmerge-audit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: 891d7b9e51c3ecc1313ee2de8d2a98036841b128
      EXPECTED_WORKFLOW: Lean Verification
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify exact main post-merge canonical run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          expected = os.environ["EXPECTED_WORKFLOW"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "erdos678-s2d-postmerge-audit",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          branch = get_json(f"{api}/repos/{repo}/branches/main")
          main_sha = branch["commit"]["sha"]
          print(f"main_head_at_audit={main_sha}")
          if main_sha != target:
              raise SystemExit(f"main moved: {main_sha} != {target}")

          run = None
          for attempt in range(40):
              data = get_json(
                  f"{api}/repos/{repo}/actions/runs?head_sha={target}&event=push&per_page=100"
              )
              candidates = [
                  r for r in data.get("workflow_runs", [])
                  if r.get("name") == expected
                  and r.get("head_sha") == target
                  and r.get("event") == "push"
              ]
              if candidates:
                  candidates.sort(key=lambda r: r.get("created_at", ""), reverse=True)
                  run = candidates[0]
                  print(
                      "postmerge_run_probe="
                      f"id:{run['id']} status:{run['status']} conclusion:{run.get('conclusion')}"
                  )
                  if run.get("status") == "completed":
                      break
              else:
                  print(f"postmerge_run_probe=none attempt:{attempt + 1}")
              time.sleep(15)
          else:
              raise SystemExit("timed out waiting for exact post-merge Lean Verification run")

          if run is None:
              raise SystemExit("no exact post-merge Lean Verification run found")
          if run.get("conclusion") != "success":
              raise SystemExit(
                  f"post-merge run {run['id']} concluded {run.get('conclusion')}"
              )

          jobs = get_json(run["jobs_url"])
          lean_jobs = [j for j in jobs.get("jobs", []) if j.get("name") == "lean"]
          if len(lean_jobs) != 1:
              raise SystemExit(f"expected one lean job, found {len(lean_jobs)}")
          job = lean_jobs[0]
          if job.get("status") != "completed" or job.get("conclusion") != "success":
              raise SystemExit(
                  f"lean job {job['id']} status={job.get('status')} conclusion={job.get('conclusion')}"
              )

          log_req = urllib.request.Request(job["logs_url"], headers=headers)
          with urllib.request.urlopen(log_req, timeout=60) as r:
              raw = r.read()
          text = raw.decode("utf-8", errors="replace")

          required = [
              f"verified_commit={target}",
              "No update necessary",
              "Build completed successfully (8808 jobs).",
          ]
          missing = [needle for needle in required if needle not in text]
          if missing:
              raise SystemExit(f"post-merge log invariants missing: {missing}")

          print(f"postmerge_run_id={run['id']}")
          print(f"postmerge_job_id={job['id']}")
          print(f"postmerge_verified_commit={target}")
          print("postmerge_import_check=No update necessary")
          print("postmerge_build_jobs=8808")
          print("s2d_postmerge_audit=PASS")
          PY
