name: Erdos 678 S2e Primary Owner Static Audit

on:
  pull_request:
    paths:
      - .github/workflows/erdos678-s2e-primary-owner-static-audit.yml
      - problems/678/experiments/s2_upgrade_robustness_runtimefix_v2.py
      - problems/678/experiments/s2_upgrade_robustness_combine.py

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compile instrumentation scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            problems/678/experiments/s2_upgrade_robustness_runtimefix_v2.py \
            problems/678/experiments/s2_upgrade_robustness_combine.py

      - name: Execute non-observational frozen static check
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/s2e-owner-static"
          python3 problems/678/experiments/s2_upgrade_robustness_runtimefix_v2.py \
            --phase static-check \
            --repo . \
            --output "$out" | tee "$out.stdout"
          grep -q '"status": "PASS"' "$out.stdout"
          test -f "$out/STATIC_CHECK.json"
          test ! -e "$out/result.json"
          test ! -d "$out/candidates"

      - name: Unit-test D1 primary owner correction without candidate execution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('problems/678/experiments/s2_upgrade_robustness_runtimefix_v2.py')
          spec = importlib.util.spec_from_file_location('runtimefix', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          owners = frozenset({
              'apparatus_or_provenance', 'package_resolution', 'lean_toolchain',
              'mathlib_or_transitive_dependency', 'pnt_dependency_support',
              'project_owned', 'ambiguous',
          })
          d1_failure = {
              'D0': {'status': 'green'},
              'D1': {'status': 'failed', 'failure': {'owner': 'package_resolution'}},
          }
          got = module.primary_owner_with_d1(d1_failure, owners, lambda _: None)
          assert got == 'package_resolution', got
          unknown = {
              'D0': {'status': 'green'},
              'D1': {'status': 'failed', 'failure': {'owner': 'unexpected'}},
          }
          got = module.primary_owner_with_d1(unknown, owners, lambda _: None)
          assert got == 'ambiguous', got
          delegated = module.primary_owner_with_d1(
              {'D0': {'status': 'green'}, 'D1': {'status': 'green'}},
              owners,
              lambda _: 'project_owned',
          )
          assert delegated == 'project_owned', delegated
          print('d1_primary_owner_static_audit=PASS')
          PY

      - name: Exercise hardened combiner on synthetic fixtures
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/combine-owner-fixtures"
          ROOT="$root" python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['ROOT'])
          root.mkdir(parents=True, exist_ok=True)
          workflow = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          apparatus = subprocess.check_output([
              'git','log','-1','--format=%H','--',
              'problems/678/experiments/s2_upgrade_robustness_runtimefix_v2.py'
          ], text=True).strip()
          common = {
              'repository': 'scientifica007/Erdos_Solving',
              'workflow_commit': workflow,
              'apparatus_commit': apparatus,
              'baseline_commit': '5039d464f6196e6b47494f0a6fae869e3362d082',
              'predeclaration_head': 'synthetic-static-audit',
              'predeclaration_merge': 'synthetic-static-audit',
              'protocol_sha256': 'synthetic-static-audit',
              'matrix_sha256': 'synthetic-static-audit',
          }
          ids = {
              'U1': 'U1-lean-4.34.0-rc1-compiler-only',
              'U2': 'U2-lean-mathlib-4.34.0-rc1-root-upgrade',
          }
          def write(short, *, primary='package_resolution', d0='green', d1='failed', suffix=''):
              target = root / f'{short}{suffix}'
              target.mkdir(parents=True, exist_ok=True)
              detection = {
                  'D0': {'status': d0},
                  'D1': (
                      {'status':'failed','failure':{'owner':'package_resolution'}}
                      if d1 == 'failed' else {'status':'green'}
                  ),
                  'D2': [],
                  'D3': {'status':'not_applicable'},
                  'D4': {'status':'not_applicable'},
                  'D5': {'status':'not_applicable'},
                  'D6': {'status':'not_applicable'},
                  'deepest_green_stage': 'D0' if d0 == 'green' else None,
                  'full_no_repair_survivor': False,
              }
              value = {
                  'schema_version': 1,
                  'experiment': 'erdos-678-s2e-upgrade-robustness',
                  'phase': 'detection',
                  'provenance': common,
                  'baseline': {'status':'green'},
                  'candidates': [{
                      'candidate_id': ids[short],
                      'detection': detection,
                      'primary_failure_owner': primary,
                      'repair_eligibility': {},
                  }],
                  'scientific_limits': ['synthetic-static-audit'],
              }
              (target/'result.json').write_text(json.dumps(value))
              return target
          write('U1')
          write('U2')
          write('U1', primary=None, suffix='-null-owner')
          write('U1', primary='package_resolution', d0='failed', suffix='-bad-d0')
          apparatus_bad = root/'U1-apparatus-invalid'
          apparatus_bad.mkdir(parents=True, exist_ok=True)
          (apparatus_bad/'APPARATUS_FAILURE.json').write_text('{}')
          PY

          python3 problems/678/experiments/s2_upgrade_robustness_combine.py \
            --u1 "$root/U1" --u2 "$root/U2" --output "$root/valid-combined" | tee "$root/valid.stdout"
          grep -q '"candidate_count": 2' "$root/valid.stdout"
          test -f "$root/valid-combined/COMBINE_AUDIT.json"

          for invalid in U1-null-owner U1-bad-d0 U1-apparatus-invalid; do
            if python3 problems/678/experiments/s2_upgrade_robustness_combine.py \
                --u1 "$root/$invalid" --u2 "$root/U2" --output "$root/fail-$invalid"; then
              echo "combiner unexpectedly accepted $invalid" >&2
              exit 1
            fi
            test -f "$root/fail-$invalid/COMBINE_FAILURE.json"
          done
          printf 'ownership_combiner_static_audit=PASS\n'
