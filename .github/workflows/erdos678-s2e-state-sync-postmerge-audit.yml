name: Temporary S2e State Sync Post-Merge Audit

on:
  pull_request:
    paths:
      - '.github/workflows/erdos678-s2e-state-sync-postmerge-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  locate-exact-main-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: c02af74cf0bcc4ce47bd4f5d74c41a00c637e044
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate exact main Lean Verification
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for attempt in $(seq 1 120); do
            payload="$(curl -fsSL "${auth[@]}" "${api}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100")"
            run_id="$(jq -r --arg sha "${TARGET_SHA}" '[.workflow_runs[] | select(.name == "Lean Verification" and .head_sha == $sha and .head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")][0].id // empty' <<<"${payload}")"
            if [[ -n "${run_id}" ]]; then
              jobs="$(curl -fsSL "${auth[@]}" "${api}/actions/runs/${run_id}/jobs?per_page=100")"
              job_id="$(jq -r '[.jobs[] | select(.name == "lean" and .status == "completed" and .conclusion == "success")][0].id // empty' <<<"${jobs}")"
              if [[ -n "${job_id}" ]]; then
                printf 'target_sha=%s\n' "${TARGET_SHA}"
                printf 'exact_main_run=%s\n' "${run_id}"
                printf 'exact_main_job=%s\n' "${job_id}"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "exact main Lean Verification did not complete successfully within audit window" >&2
          exit 1
